<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PrestoDeck &middot; finishing setup</title>
<style>
  body { margin: 0; background: #121212; color: #f5f5f5;
         font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
         display: flex; min-height: 100vh; align-items: center; justify-content: center; }
  .card { text-align: center; padding: 32px; max-width: 340px; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { color: #b3b3b3; line-height: 1.5; }
  a { display: inline-block; margin-top: 20px; padding: 14px 22px; border-radius: 28px;
      background: #1db954; color: #fff; font-weight: 600; text-decoration: none; }
  code { color: #ff6b6b; word-break: break-all; }
</style>
</head>
<body>
<div class="card" id="card">
  <h1>Finishing setup&hellip;</h1>
  <p>Sending you back to your PrestoDeck.</p>
</div>
<script>
  // Spotify redirected here (https, the only kind it allows for non-loopback).
  // The device packed its address into `state` as "ip:port|nonce"; bounce the
  // browser back to the device (http, same LAN) via a top-level navigation,
  // which is exempt from mixed-content blocking. The device exchanges the code.
  (function () {
    var p = new URLSearchParams(location.search);
    var code = p.get("code");
    var state = p.get("state") || "";
    var error = p.get("error");
    var card = document.getElementById("card");

    // textContent only — never build DOM from query params via innerHTML.
    function para(text) { var el = document.createElement("p"); el.textContent = text; return el; }
    function show(title, node) {
      var h1 = document.createElement("h1"); h1.textContent = title;
      card.replaceChildren(h1, node);
    }
    function fail(text) { show("Setup error", para(text)); }

    if (error) { fail("Spotify reported: " + error); return; }
    var sep = state.indexOf("|");
    if (!code || sep < 0) { fail("Missing authorization data. Reopen the setup page on the device."); return; }

    var target = state.slice(0, sep);      // ip:port
    var nonce = state.slice(sep + 1);      // device-issued nonce
    // Only ever redirect to a LAN IPv4:port — blocks open-redirect to other
    // hosts or javascript:/data: schemes smuggled in via state.
    if (!/^(?:\d{1,3}\.){3}\d{1,3}:\d{1,5}$/.test(target)) { fail("Invalid device address."); return; }

    var url = "http://" + target + "/callback?code=" + encodeURIComponent(code) +
              "&state=" + encodeURIComponent(nonce);

    var link = document.createElement("a");
    link.href = url;                       // safe: url derives from validated target
    link.textContent = "Return to PrestoDeck";
    var wrap = document.createElement("div");
    wrap.appendChild(para("If nothing happens, tap below."));
    wrap.appendChild(link);
    show("Finishing setup…", wrap);
    location.replace(url);
  })();
</script>
</body>
</html>
